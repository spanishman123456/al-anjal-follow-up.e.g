<title>سجل متابعة الطلاب</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: an analytical report — every chart sits beside the reading of it, and the
   report drills from all classes, to one class, to one student. */
:root {
  --canvas: #f1f4f9;
  --card: #ffffff;
  --sunk: #f6f8fc;
  --line: #e3e9f2;
  --line-soft: #eef2f8;
  --ink: #111827;
  --ink-2: #4b5768;
  --ink-3: #78869b;
  --brand: #123a63;
  --brand-2: #1d4ed8;
  --accent: #0e7490;
  /* The only three colours that carry a judgement about a student. */
  --on: #047857;
  --on-soft: #d1fae5;
  --mid: #c2730a;
  --mid-soft: #fef3c7;
  --low: #c0152f;
  --low-soft: #ffe4e9;
  --up: #047857;
  --up-soft: #d1fae5;
  --flat: #64748b;
  --flat-soft: #e9edf3;
  --down: #c0152f;
  --down-soft: #ffe4e9;
  --warn: #c2730a;
  --warn-soft: #fef3c7;
  --head: #1e1b4b;
  --shadow: 0 1px 2px rgba(17,24,39,.05), 0 6px 18px rgba(17,24,39,.05);
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--canvas); color: var(--ink); direction: rtl;
  font-family: "IBM Plex Sans Arabic", "Segoe UI", system-ui, sans-serif;
  font-size: 14px; line-height: 1.75;
}
.sheet {
  max-width: 1240px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 64px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 20; background: var(--head); }

/* ---- chrome ---- */
.bar { background: var(--head); color: #fff; }
.bar-in {
  max-width: 1240px; margin: 0 auto; display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 15px;
}
.bar-in .lg { height: 42px; width: auto; flex: none; }
/* Only the marks that are printed in colour need a light chip behind them. */
.bar-in .lg-chip { background: #fff; border-radius: 8px; padding: 5px 8px; }
.bar-in .lg-sm { height: 40px; }
.bar-in .lgs { display: flex; gap: 8px; align-items: center; }
.bar-in .t { font-weight: 700; font-size: 1.06rem; flex: 1 1 auto; min-width: 0; }
.bar-in .t small { display: block; font-weight: 400; font-size: .74rem; color: #a5b4cf; }
.pill { font-size: .74rem; border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 4px 12px; color: #cbd5e9; white-space: nowrap; }
.nav { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; font-size: .82rem; margin-block: 16px 2px; }
.nav button { font: inherit; font-family: inherit; background: none; border: 0; cursor: pointer; color: var(--brand-2); font-weight: 600; padding: 2px; border-radius: 6px; }
.nav button:hover { text-decoration: underline; }
.nav span.sep { color: var(--ink-3); }
.nav span.cur { color: var(--ink-3); font-weight: 600; }

/* ---- report title ---- */
.hero {
  background: linear-gradient(135deg, var(--head), #4c1d95 72%, #6d28d9);
  color: #fff; border-radius: 16px; padding: 26px 24px; margin-top: 14px;
  box-shadow: var(--shadow);
}
.hero h1 { margin: 0 0 6px; font-size: 1.6rem; font-weight: 700; line-height: 1.3; }
.hero p { margin: 0; color: #d9d2f5; font-size: .88rem; max-width: 72ch; }
.hero .facts { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.hero .facts span { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.14); border-radius: 8px; padding: 5px 11px; font-size: .78rem; }

/* ---- blocks ---- */
h2.sh { font-size: 1.1rem; font-weight: 700; margin: 30px 0 3px; }
p.sub { margin: 0 0 14px; color: var(--ink-2); font-size: .84rem; max-width: 80ch; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.pad { padding: 18px; }
.prose { font-size: .87rem; color: var(--ink-2); }
.prose p { margin: 0 0 9px; }
.prose p:last-child { margin: 0; }
.bullets { margin: 0; padding: 0; list-style: none; display: grid; gap: 9px; }
.bullets li { position: relative; padding-inline-start: 17px; font-size: .855rem; color: var(--ink-2); }
.bullets li::before { content: ""; position: absolute; inset-inline-start: 0; top: .62em; width: 7px; height: 7px; border-radius: 2px; background: var(--brand-2); }
.bullets li.good::before { background: var(--up); }
.bullets li.bad::before { background: var(--down); }
.bullets li b { color: var(--ink); font-weight: 600; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(146px, 1fr)); gap: 12px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 13px; padding: 14px 15px; box-shadow: var(--shadow); }
.kpi .l { font-size: .75rem; color: var(--ink-3); }
.kpi .v { font-size: 1.68rem; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
.kpi .d { font-size: .74rem; color: var(--ink-3); }
.kpi.up .v { color: var(--up); } .kpi.down .v { color: var(--down); } .kpi.flat .v { color: var(--flat); }

/* chart beside its reading */
.pair { display: grid; grid-template-columns: 1.55fr 1fr; gap: 14px; align-items: stretch; }
.pair.flip { grid-template-columns: 1fr 1.55fr; }
@media (max-width: 880px) { .pair, .pair.flip { grid-template-columns: 1fr; } }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 18px; min-width: 0; }
.panel > h3 { margin: 0 0 2px; font-size: .97rem; font-weight: 700; }
.panel > .cap { margin: 0 0 13px; font-size: .79rem; color: var(--ink-3); }
.ins { background: var(--sunk); border-color: var(--line-soft); }
.ins h3 { color: var(--brand); }
.band-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .78rem; color: var(--ink-3); margin-top: 10px; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
/* Chart coordinates are geometric, but an RTL container flips what text-anchor
   "start" and "end" mean, which pushed labels outside their card. Pin the text
   direction so an anchor always means the side it is placed on; Arabic inside
   each label still shapes right-to-left on its own. */
.chart svg text { direction: ltr; unicode-bidi: isolate; }
.axis { font-size: 10.5px; fill: var(--ink-3); }
.vlab { font-size: 10.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
.nlab { font-size: 10.5px; fill: var(--ink-2); }
.gl { stroke: var(--line); stroke-dasharray: 2 5; }
.hit { cursor: pointer; }
.hit:hover rect.bar, .hit:hover circle.pt { filter: brightness(1.12); }
.hit:focus-visible { outline: 2px solid var(--brand-2); outline-offset: 2px; }
.key { display: flex; gap: 14px; flex-wrap: wrap; font-size: .77rem; color: var(--ink-3); margin-top: 10px; }
.key i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; margin-inline-end: 6px; vertical-align: -1px; }

/* class cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(236px, 1fr)); gap: 13px; }
.cc {
  text-align: start; font: inherit; font-family: inherit; color: inherit; cursor: pointer; min-width: 0;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px;
  box-shadow: var(--shadow); display: grid; gap: 11px; transition: transform .15s, border-color .15s, box-shadow .15s;
}
.cc:hover { transform: translateY(-3px); border-color: var(--brand-2); }
.cc:focus-visible { outline: 2px solid var(--brand-2); outline-offset: 2px; }
.cc .r1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.cc .nm { font-size: 1.16rem; font-weight: 700; }
.chip { font-size: .68rem; border-radius: 999px; padding: 3px 9px; border: 1px solid var(--line); color: var(--ink-3); white-space: nowrap; }
.chip.ar { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.chip.in { color: var(--brand-2); border-color: color-mix(in srgb, var(--brand-2) 45%, transparent); }
.cc .pc { font-size: 1.95rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.cc .pc small { font-size: .7rem; font-weight: 400; color: var(--ink-3); display: block; margin-top: 4px; }
.meter { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--flat-soft); }
.m3 { display: flex; gap: 11px; font-size: .74rem; flex-wrap: wrap; }
.m3 b { font-variant-numeric: tabular-nums; }

/* tables */
.scroll { overflow-x: auto; border-radius: 12px; border: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; font-size: .845rem; min-width: 560px; background: var(--card); }
thead th { background: var(--head); color: #fff; text-align: right; padding: 10px 12px; font-weight: 600; white-space: nowrap; }
tbody td { padding: 9px 12px; border-top: 1px solid var(--line-soft); font-variant-numeric: tabular-nums; }
tbody tr:nth-child(even) td { background: var(--sunk); }
tbody tr.clk { cursor: pointer; }
tbody tr.clk:hover td { background: color-mix(in srgb, var(--brand-2) 9%, transparent); }
.tagv { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; white-space: nowrap; }
.tri { width: 0; height: 0; flex: none; }
.tri.up { border-inline: 5px solid transparent; border-bottom: 9px solid var(--up); }
.tri.down { border-inline: 5px solid transparent; border-top: 9px solid var(--down); }
.tri.flat { width: 10px; height: 3px; background: var(--flat); border-radius: 2px; }
.tri.none { width: 8px; height: 2px; background: var(--line); }
.lv { font-size: .74rem; font-weight: 600; border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.lv.on_level { background: var(--on-soft); color: var(--on); }
.lv.approach { background: var(--mid-soft); color: var(--mid); }
.lv.below { background: var(--low-soft); color: var(--low); }
.lv.no_data { background: var(--flat-soft); color: var(--flat); }

/* student */
.shero { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
.shero .who { flex: 1 1 220px; min-width: 0; }
.shero h2 { margin: 0 0 7px; font-size: 1.42rem; font-weight: 700; overflow-wrap: anywhere; }
.tags { display: flex; gap: 8px; flex-wrap: wrap; }
.pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }
.pager button { font: inherit; font-family: inherit; cursor: pointer; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 9px 16px; box-shadow: var(--shadow); }
.pager button:hover:not(:disabled) { border-color: var(--brand-2); }
.pager button:disabled { opacity: .42; cursor: default; }
.mt { margin-top: 14px; }
.tip { position: fixed; z-index: 70; pointer-events: none; opacity: 0; transition: opacity .12s; background: var(--head); color: #fff; border-radius: 8px; padding: 7px 11px; font-size: .78rem; white-space: nowrap; box-shadow: 0 10px 28px rgba(0,0,0,.35); }
.btnbar { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.expbar { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 13px; padding: 13px 15px; box-shadow: var(--shadow); margin-top: 13px; }
.expbar .explabel { font-weight: 700; font-size: .87rem; margin-inline-end: 4px; }
.expbar .btn { padding: 8px 15px; font-size: .83rem; }
.btn {
  font: inherit; font-family: inherit; cursor: pointer; border-radius: 10px;
  padding: 10px 18px; font-weight: 600; border: 1px solid var(--line);
  background: var(--card); color: var(--ink); box-shadow: var(--shadow);
}
.btn.main { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn:hover { border-color: var(--brand-2); }
.rep { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 18px; margin-top: 13px; }
.rep .rh { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid var(--line-soft); padding-bottom: 11px; margin-bottom: 13px; }
.rep .rh .idx { width: 30px; height: 30px; flex: none; border-radius: 9px; background: var(--sunk); color: var(--ink-2); display: grid; place-items: center; font-weight: 700; font-size: .82rem; }
.rep .rh .rn { flex: 1 1 160px; min-width: 0; font-size: 1.05rem; font-weight: 700; overflow-wrap: anywhere; }
.rep .rg { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 760px) { .rep .rg { grid-template-columns: 1fr; } }
.rep .mini { font-size: .8rem; color: var(--ink-2); }
.rep .mini table { min-width: 0; border: 1px solid var(--line-soft); border-radius: 8px; overflow: hidden; }
.rep .mini thead th { background: var(--sunk); color: var(--ink-2); font-size: .76rem; padding: 7px 9px; }
.rep .mini tbody td { padding: 7px 9px; font-size: .8rem; }
.vw { animation: in .24s ease both; }
@keyframes in { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .vw { animation: none; } .cc { transition: none; } }
</style>

  function sv(n, a) { var e = document.createElementNS(NS, n); for (var k in a) e.setAttribute(k, a[k]); return e; }
  function box(w, ht) { return sv("svg", { viewBox: "0 0 " + w + " " + ht, width: "100%", height: ht, preserveAspectRatio: "xMidYMid meet" }); }
  function tx(s, x, y, str, cls, anc, fill) {
    var t = sv("text", { x: x, y: y, class: cls || "axis", "text-anchor": anc || "middle" });
    if (fill) t.setAttribute("fill", fill);
    t.textContent = str; s.appendChild(t); return t;
  }
  function wrapChart(svg) { var d = h("div", "chart"); d.appendChild(svg); return d; }

  /* movement: a row per student — stripe, bar, value pill, name. Rows that did not
     move still read as a row, because a hairline at zero looked like missing data. */
  function chartMovement(c, onPick) {
    var lang = langOf(c), t = T[lang];
    var rows = c.students.map(function (s) { return { s: s, m: mv(s) }; })
      .filter(function (r) { return r.m.d !== null; })
      .sort(function (a, b) { return b.m.d - a.m.d; });
    if (!rows.length) {
      var e = h("div", "chart");
      e.appendChild(h("p", "cap", t.noTwoAttempts));
      return e;
    }
    var W = 880, rh = 26, T0 = 10, B = 34, NAME = 250, VAL = 58;
    var H = T0 + rows.length * rh + B;
    var pR = W - NAME - VAL, pL = 14;
    var span = Math.max.apply(null, rows.map(function (r) { return Math.abs(r.m.d); })) || 1;
    var mid = (pR + pL) / 2, half = (pR - pL) / 2 / (span * 1.08);
    function X(v) { return mid - v * half; }
    var s = box(W, H);

    [-span, -span / 2, 0, span / 2, span].forEach(function (v) {
      s.appendChild(sv("line", { x1: X(v), x2: X(v), y1: T0, y2: H - B + 4, class: "gl" }));
      tx(s, X(v), H - B + 22, sg(v));
    });

    rows.forEach(function (r, i) {
      var y = T0 + i * rh;
      var g = sv("g", { class: "hit", tabindex: "0", role: "button" });
      if (i % 2 === 0) {
        g.appendChild(sv("rect", { x: 0, y: y, width: W, height: rh, fill: "var(--sunk)", rx: 5 }));
      }
      var x0 = X(0), x1 = X(r.m.d), colour = col(r.m.dir);
      if (Math.abs(r.m.d) < 0.01) {
        // Held level: a dot on the axis, so the row reads as measured, not missing.
        g.appendChild(sv("circle", { class: "bar", cx: x0, cy: y + rh / 2, r: 5, fill: "var(--flat)" }));
      } else {
        g.appendChild(sv("rect", { class: "bar", x: Math.min(x0, x1), y: y + 5, rx: 4,
          width: Math.max(5, Math.abs(x1 - x0)), height: rh - 10, fill: colour }));
      }
      var pill = sv("rect", { x: W - NAME - VAL + 2, y: y + 4, width: VAL - 8, height: rh - 8, rx: 7,
        fill: r.m.dir === "up" ? "var(--on-soft)" : r.m.dir === "down" ? "var(--low-soft)" : "var(--flat-soft)" });
      g.appendChild(pill);
      var vl = sv("text", { x: W - NAME - 8, y: y + rh / 2 + 4, class: "vlab", "text-anchor": "end", fill: colour });
      vl.textContent = sg(r.m.d); g.appendChild(vl);
      var nm = sv("text", { x: W - 6, y: y + rh / 2 + 4, class: "nlab", "text-anchor": "end" });
      nm.textContent = r.s.n; g.appendChild(nm);
      s.appendChild(g);
      bindTip(g, r.s.n + " · " + sg(r.m.d));
      g.addEventListener("click", function () { onPick(r.s); });
      g.addEventListener("keydown", function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); onPick(r.s); } });
    });
    s.appendChild(sv("line", { x1: X(0), x2: X(0), y1: T0, y2: H - B + 4, stroke: "var(--ink)", "stroke-width": "2" }));
    return wrapChart(s);
  }

  /* every student against every attempt, one cell each, coloured by the band it falls in */
  function chartHeatmap(c, onPick) {
    var lang = langOf(c), t = T[lang];
    var list = c.students.slice().sort(function (a, b) { return (b.t || 0) - (a.t || 0); });
    var W = 880, rh = 22, T0 = 40, B = 10, NAME = 250;
    var H = T0 + list.length * rh + B;
    var cols = c.labels.length + 1;
    var plot = W - NAME - 16;
    var cw = plot / cols;
    var s = box(W, H);
    var heads = c.labels.concat([t.totalShort]);
    heads.forEach(function (lab, k) {
      tx(s, W - NAME - 16 - (k + 0.5) * cw, T0 - 16, lab, "axis");
    });
    list.forEach(function (s0, i) {
      var y = T0 + i * rh;
      var g = sv("g", { class: "hit", tabindex: "0", role: "button" });
      var nm = sv("text", { x: W - 6, y: y + rh / 2 + 4, class: "nlab", "text-anchor": "end" });
      nm.textContent = s0.n; g.appendChild(nm);
      var cells = pct(s0).concat([tpct(c, s0)]);
      cells.forEach(function (v, k) {
        var x = W - NAME - 16 - (k + 1) * cw;
        var cell = sv("rect", { class: "bar", x: x + 2, y: y + 2, width: cw - 4, height: rh - 4, rx: 4,
          fill: v === null ? "var(--flat-soft)" : band(v).c, opacity: v === null ? 1 : 0.88 });
        g.appendChild(cell);
        var lab = sv("text", { x: x + cw / 2, y: y + rh / 2 + 4, class: "vlab", "text-anchor": "middle",
          fill: v === null ? "var(--ink-3)" : "#fff" });
        lab.textContent = v === null ? "—" : Math.round(v) + "%";
        g.appendChild(lab);
        bindTip(cell, s0.n + " · " + heads[k] + ": " + (v === null ? t.none : Math.round(v) + "%"));
      });
      s.appendChild(g);
      g.addEventListener("click", function () { onPick(s0); });
      g.addEventListener("keydown", function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); onPick(s0); } });
    });
    var d = wrapChart(s);
    var k2 = h("div", "key");
    BANDS.forEach(function (b) {
      var sp = h("span");
      var i2 = h("i"); i2.style.background = b.c; sp.appendChild(i2);
      sp.appendChild(document.createTextNode(lang === "en" ? LV_EN[b.id] : b.label));
      k2.appendChild(sp);
    });
    d.appendChild(k2);
    return d;
  }

  function chartDonut(parts, centre, sub) {
    var W = 300, H = 196, cx = W / 2, cy = 96, R = 74, r = 47;
    var s = box(W, H);
    var total = parts.reduce(function (a, p) { return a + p[1]; }, 0) || 1;
    var ang = -Math.PI / 2;
    parts.forEach(function (p) {
      if (!p[1]) return;
      var a2 = ang + (p[1] / total) * Math.PI * 2;
      var big = (a2 - ang) > Math.PI ? 1 : 0;
      var d = ["M", cx + R * Math.cos(ang), cy + R * Math.sin(ang),
        "A", R, R, 0, big, 1, cx + R * Math.cos(a2), cy + R * Math.sin(a2),
        "L", cx + r * Math.cos(a2), cy + r * Math.sin(a2),
        "A", r, r, 0, big, 0, cx + r * Math.cos(ang), cy + r * Math.sin(ang), "Z"].join(" ");
      var path = sv("path", { d: d, fill: p[2], stroke: "var(--card)", "stroke-width": "2" });
      s.appendChild(path);
      bindTip(path, p[0] + ": " + p[1] + " (" + Math.round(p[1] / total * 100) + "%)");
      ang = a2;
    });
    tx(s, cx, cy + 4, String(centre), "vlab", "middle", "var(--ink)").setAttribute("style", "font-size:27px;font-weight:700");
    tx(s, cx, cy + 24, sub, "axis");
    // Laid out as HTML, not inside the SVG: flex handles the right-to-left run and
    // the swatches can never land on top of their own numbers.
    var d = wrapChart(s);
    var k = h("div", "key");
    parts.forEach(function (p) {
      if (!p[1]) return;
      var sp = h("span");
      var sw = h("i"); sw.style.background = p[2];
      sp.appendChild(sw);
      sp.appendChild(document.createTextNode(p[0] + " " + p[1]));
      k.appendChild(sp);
    });
    d.appendChild(k);
    return d;
  }

  /* horizontal ranked bars with the label in its own column */
  function chartRanked(items, maxVal, unit, onPick) {
    var W = 560, rh = 34, T = 4, B = 6, NAME = 150, VAL = 62;
    var H = T + items.length * rh + B;
    var plot = W - NAME - VAL - 8;
    var s = box(W, H);
    items.forEach(function (it, i) {
      var y = T + i * rh;
      var w = Math.max(3, (it[1] / maxVal) * plot);
      var g = sv("g", onPick ? { class: "hit", tabindex: "0", role: "button" } : {});
      var nm = sv("text", { x: W, y: y + 15, class: "nlab", "text-anchor": "end" });
      nm.textContent = it[0]; g.appendChild(nm);
      g.appendChild(sv("rect", { x: W - NAME - 8 - plot, y: y + 20, width: plot, height: 11, rx: 5.5, fill: "var(--sunk)" }));
      g.appendChild(sv("rect", { class: "bar", x: W - NAME - 8 - w, y: y + 20, width: w, height: 11, rx: 5.5, fill: it[2] || "var(--on)" }));
      var vl = sv("text", { x: W - NAME - 16 - plot, y: y + 30, class: "vlab", "text-anchor": "end", fill: "var(--ink-2)" });
      vl.textContent = r1(it[1]) + unit; g.appendChild(vl);
      s.appendChild(g);
      if (onPick) {
        bindTip(g, it[0] + " · " + r1(it[1]) + unit);
        g.addEventListener("click", function () { onPick(i); });
        g.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onPick(i); } });
      }
    });
    return wrapChart(s);
  }

  /* 100% stacked composition, one row per class */
  function chartStack(classes, onPick) {
    var W = 560, rh = 38, T = 4, NAME = 128;
    var H = T + classes.length * rh + 24;
    var plot = W - NAME - 16;
    var s = box(W, H);
    classes.forEach(function (c, i) {
      var y = T + i * rh, t = tally(c), n = c.students.length || 1, x = W - NAME - 8;
      var g = sv("g", { class: "hit", tabindex: "0", role: "button" });
      var nm = sv("text", { x: W, y: y + 22, class: "nlab", "text-anchor": "end" });
      nm.textContent = c.name; g.appendChild(nm);
      [["تحسّن", t.up, "var(--up)"], ["ثابت", t.flat, "var(--flat)"], ["تراجع", t.down, "var(--down)"], ["غير مكتمل", t.none, "var(--line)"]]
        .forEach(function (p) {
          if (!p[1]) return;
          var w = p[1] / n * plot;
          var rect = sv("rect", { class: "bar", x: x - w, y: y + 12, width: w, height: 15, fill: p[2] });
          g.appendChild(rect);
          bindTip(rect, c.name + " · " + p[0] + ": " + p[1]);
          if (w > 22) {
            var lb = sv("text", { x: x - w / 2, y: y + 23, class: "vlab", "text-anchor": "middle", fill: "#fff" });
            lb.textContent = p[1]; g.appendChild(lb);
          }
          x -= w;
        });
      s.appendChild(g);
      g.addEventListener("click", function () { onPick(c); });
      g.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onPick(c); } });
    });
    return wrapChart(s);
  }

  /* attempts: the class mean, optionally with one student over it */
  function chartAttempts(c, s0) {
    var avg = attAvg(c), mine = s0 ? pct(s0) : null;
    var W = 560, H = 250, L = 16, R = 52, T = 30, B = 44, n = c.labels.length;
    function X(i) { return W - R - (i * (W - R - L)) / Math.max(1, n - 1); }
    function Y(v) { return T + (100 - v) / 100 * (H - T - B); }
    var s = box(W, H);
    [0, 25, 50, 75, 100].forEach(function (v) {
      s.appendChild(sv("line", { x1: L, x2: W - R, y1: Y(v), y2: Y(v), class: "gl" }));
      tx(s, W - R + 10, Y(v) + 4, v + "%", "axis", "start");
    });
    function draw(vals, colour, wdt, dash) {
      var pts = [];
      vals.forEach(function (v, i) { if (v !== null) pts.push([X(i), Y(v)]); });
      if (pts.length > 1) {
        var ln = sv("path", { d: pts.map(function (p, i) { return (i ? "L" : "M") + p[0] + " " + p[1]; }).join(" "),
          fill: "none", stroke: colour, "stroke-width": wdt, "stroke-linecap": "round", "stroke-linejoin": "round" });
        if (dash) ln.setAttribute("stroke-dasharray", dash);
        s.appendChild(ln);
      }
      pts.forEach(function (p) { s.appendChild(sv("circle", { class: "pt", cx: p[0], cy: p[1], r: wdt > 2.4 ? 5.5 : 4.2, fill: "var(--card)", stroke: colour, "stroke-width": "2.6" })); });
    }
    draw(avg, "var(--ink-3)", 2, "6 5");
    var mineColour = s0 ? bandColour(tpct(c, s0)) : "var(--on)";
    if (mine) draw(mine, mineColour, 3.4);
    (mine || avg).forEach(function (v, i) {
      if (v === null) return;
      tx(s, X(i), Y(v) - 14, r0(v) + "%", "vlab", "middle", mine ? mineColour : "var(--ink-2)");
    });
    c.labels.forEach(function (l, i) { tx(s, X(i), H - B + 22, l, "axis"); });
    var d = wrapChart(s);
    var k = h("div", "key");
    k.innerHTML = mine
      ? '<span><i style="background:' + mineColour + '"></i>الطالب</span><span><i style="background:var(--ink-3)"></i>متوسط الفصل</span>'
      : '<span><i style="background:var(--ink-3)"></i>متوسط الفصل</span>';
    d.appendChild(k);
    return d;
  }

  /* how the class's totals are spread, in the three performance bands */
  function chartSpread(c, s0) {
    var vals = c.students.map(function (s) { return tpct(c, s); }).filter(function (v) { return v !== null; });
    var mine = s0 ? tpct(c, s0) : null;
    var mineBand = mine === null ? null : band(mine).id;
    var groups = BANDS.map(function (b) {
      return { b: b, n: vals.filter(function (v) { return band(v).id === b.id; }).length };
    });
    var W = 560, H = 236, T = 24, B = 62, L = 24, R = 24;
    var top = Math.max.apply(null, groups.map(function (g) { return g.n; })) || 1;
    var bw = (W - L - R) / groups.length;
    var s = box(W, H);
    groups.forEach(function (g, i) {
      var x = W - R - (i + 1) * bw;
      var ht = (g.n / top) * (H - T - B);
      var isMine = mineBand === g.b.id;
      var rect = sv("rect", { class: "bar", x: x + 16, y: H - B - ht, width: bw - 32,
        height: Math.max(g.n ? 4 : 0, ht), rx: 6, fill: g.b.c, opacity: isMine || mine === null ? 1 : .42 });
      s.appendChild(rect);
      bindTip(rect, g.b.label + ": " + g.n + " طالب");
      if (isMine) {
        // The student's own band is ringed rather than recoloured, so the band
        // keeps the colour that states the judgement.
        s.appendChild(sv("rect", { x: x + 11, y: H - B - ht - 5, width: bw - 22, height: Math.max(g.n ? 4 : 0, ht) + 10,
          rx: 9, fill: "none", stroke: g.b.c, "stroke-width": "2.5", "stroke-dasharray": "5 4" }));
        tx(s, x + bw / 2, H - B - ht - 14, "نطاق الطالب", "vlab", "middle", g.b.c);
      }
      if (g.n) tx(s, x + bw / 2, H - B - ht + (ht > 22 ? 18 : -8), String(g.n), "vlab", "middle", ht > 22 ? "#fff" : "var(--ink-2)");
      tx(s, x + bw / 2, H - B + 20, g.b.label, "axis");
      tx(s, x + bw / 2, H - B + 36, g.b.min >= 0 ? g.b.min + "٪ فأعلى" : "أقل من 86٪", "axis");
    });
    s.appendChild(sv("line", { x1: L, x2: W - R, y1: H - B, y2: H - B, stroke: "var(--line)" }));
    return wrapChart(s);
  }

  function chartComponents(s0) {
    var W = 520, rh = 40, T = 4, NAME = 152, VAL = 72;
    var H = T + s0.comp.length * rh + 6, plot = W - NAME - VAL - 8;
    var s = box(W, H);
    s0.comp.forEach(function (cp, i) {
      var y = T + i * rh, max = cp[2], v = cp[1] === null ? 0 : cp[1];
      var w = Math.max(3, v / max * plot);
      var nm = sv("text", { x: W, y: y + 16, class: "nlab", "text-anchor": "end" });
      nm.textContent = cp[0]; s.appendChild(nm);
      s.appendChild(sv("rect", { x: W - NAME - 8 - plot, y: y + 21, width: plot, height: 12, rx: 6, fill: "var(--sunk)" }));
      var rect = sv("rect", { class: "bar", x: W - NAME - 8 - w, y: y + 21, width: w, height: 12, rx: 6,
        fill: bandColour(max ? v / max * 100 : null) });
      s.appendChild(rect);
      bindTip(rect, cp[0] + ": " + r1(v) + " من " + max);
      tx(s, W - NAME - 16 - plot, y + 31, r1(v) + " / " + max, "vlab", "end", "var(--ink-2)");
    });
    return wrapChart(s);
  }

  function ring(p, label, sub) {
    var S = 132, R = 54, C = 2 * Math.PI * R;
    var s = sv("svg", { viewBox: "0 0 " + S + " " + S, width: S, height: S });
    s.appendChild(sv("circle", { cx: S / 2, cy: S / 2, r: R, fill: "none", stroke: "var(--sunk)", "stroke-width": "12" }));
    s.appendChild(sv("circle", { cx: S / 2, cy: S / 2, r: R, fill: "none", stroke: bandColour(p), "stroke-width": "12",
      "stroke-linecap": "round", "stroke-dasharray": C, "stroke-dashoffset": C * (1 - Math.max(0, Math.min(1, (p || 0) / 100))),
      transform: "rotate(-90 " + S / 2 + " " + S / 2 + ")" }));
    tx(s, S / 2, S / 2 + 3, label, "vlab", "middle", "var(--ink)").setAttribute("style", "font-size:24px;font-weight:700");
    tx(s, S / 2, S / 2 + 22, sub, "axis");
    return s;
  }

  /* ---------------- written readings ---------------- */
  function overallInsights() {
    var all = D.classes.reduce(function (a, c) { return a.concat(c.students.map(function (s) { return { c: c, s: s }; })); }, []);
    var t = { up: 0, flat: 0, down: 0, none: 0 };
    D.classes.forEach(function (c) { var k = tally(c); t.up += k.up; t.flat += k.flat; t.down += k.down; t.none += k.none; });
    var measured = t.up + t.flat + t.down;
    var byAvg = D.classes.slice().sort(function (a, b) { return (clsAvgPct(b) || 0) - (clsAvgPct(a) || 0); });
    var byDown = D.classes.slice().sort(function (a, b) { return tally(b).down / b.students.length - tally(a).down / a.students.length; });
    var byUp = D.classes.slice().sort(function (a, b) { return tally(b).up / b.students.length - tally(a).up / a.students.length; });
    var movers = all.filter(function (x) { return mv(x.s).d !== null; });
    var best = movers.slice().sort(function (a, b) { return mv(b.s).d - mv(a.s).d; })[0];
    var worst = movers.slice().sort(function (a, b) { return mv(a.s).d - mv(b.s).d; })[0];
    var out = [];
    out.push(['تمّت متابعة <b>' + all.length + ' طالبًا</b> في <b>' + D.classes.length + ' فصول</b>، ورُصد اتجاه واضح لـ <b>' + measured + '</b> منهم؛ الباقي لم تُرصد له محاولتان بعد.', null]);
    out.push(['<b>' + t.up + '</b> طالبًا تحسّن مستواه مقابل <b>' + t.down + '</b> تراجعوا، و<b>' + t.flat + '</b> حافظوا على مستواهم — أي أنّ ' + Math.round(t.up / Math.max(1, measured) * 100) + '٪ من المقيسين في تقدّم.', t.up >= t.down ? "good" : "bad"]);
    out.push(['أعلى الفصول متوسطًا <b>' + byAvg[0].name + '</b> بنسبة ' + r0(clsAvgPct(byAvg[0])) + '٪، وأدناها <b>' + byAvg[byAvg.length - 1].name + '</b> بنسبة ' + r0(clsAvgPct(byAvg[byAvg.length - 1])) + '٪.', null]);
    out.push(['<b>' + byUp[0].name + '</b> هو الأكثر تقدّمًا: ' + tally(byUp[0]).up + ' من ' + byUp[0].students.length + ' طالبًا ارتفع مستواهم.', "good"]);
    out.push(['<b>' + byDown[0].name + '</b> يحتاج المتابعة أولًا: ' + tally(byDown[0]).down + ' من ' + byDown[0].students.length + ' طالبًا انخفض مستواهم.', "bad"]);
    if (best) out.push(['أكبر تقدّم فردي: <b>' + best.s.n + '</b> (' + best.c.name + ') بزيادة ' + sg(mv(best.s).d) + '.', "good"]);
    if (worst && mv(worst.s).d < 0) out.push(['أكبر تراجع فردي: <b>' + worst.s.n + '</b> (' + worst.c.name + ') بانخفاض ' + sg(mv(worst.s).d) + '.', "bad"]);
    return out;
  }

  function pathInsights(c, lang) {
    var avg = attAvg(c), o = [], en = lang === "en";
    c.labels.forEach(function (l, i) {
      if (avg[i] === null) { o.push(["<b>" + l + "</b>: " + (en ? "not recorded yet." : "لم يُرصد بعد."), null]); return; }
      o.push(["<b>" + l + "</b>: " + (en ? "class average " : "متوسط الفصل ") + r0(avg[i]) + "%.", null]);
    });
    for (var i = 1; i < avg.length; i++) {
      if (avg[i] === null || avg[i - 1] === null) continue;
      var d = avg[i] - avg[i - 1];
      o.push([(en ? "From " : "من ") + c.labels[i - 1] + (en ? " to " : " إلى ") + c.labels[i] + ": " +
        (en ? (d >= 0 ? "a rise of " : "a fall of ") : (d >= 0 ? "ارتفاع بـ " : "انخفاض بـ ")) +
        "<b>" + r0(Math.abs(d)) + (en ? " points" : " نقطة") + "</b>.", d >= 0 ? "good" : "bad"]);

    });
    var lowest = vals.length ? Math.min.apply(null, vals) : null;

  function classInsights(c, lang) {

  function arClassInsights(c) {
    var t = tally(c), n = c.students.length, avg = attAvg(c);
    var movers = c.students.filter(function (s) { return mv(s).d !== null; });
    var best = movers.slice().sort(function (a, b) { return mv(b).d - mv(a).d; })[0];
    var worst = movers.slice().sort(function (a, b) { return mv(a).d - mv(b).d; })[0];
    var first = avg[0], last = avg[avg.length - 1];
    var out = [];
    out.push(['يضمّ الفصل <b>' + n + ' طالبًا</b>، متوسط إجماليهم <b>' + r1(clsAvg(c)) + ' من ' + c.tmax + '</b> أي ' + r0(clsAvgPct(c)) + '٪.', null]);
    if (first !== null && last !== null) {
      var shift = last - first;
      out.push(['انتقل متوسط الفصل من <b>' + r0(first) + '٪</b> في ' + c.labels[0] + ' إلى <b>' + r0(last) + '٪</b> في ' + c.labels[c.labels.length - 1] + '، بفارق ' + sg(shift) + '.', shift >= 0 ? "good" : "bad"]);
    }
    out.push(['<b>' + t.up + '</b> تحسّنوا، <b>' + t.flat + '</b> ثبتوا، <b>' + t.down + '</b> تراجعوا' + (t.none ? '، و<b>' + t.none + '</b> لم تُرصد له محاولتان' : '') + '.', t.up >= t.down ? "good" : "bad"]);
    if (best && mv(best).d > 0) out.push(['أبرز تقدّم: <b>' + best.n + '</b> بزيادة ' + sg(mv(best).d) + '.', "good"]);
    if (worst && mv(worst).d < 0) out.push(['أبرز تراجع: <b>' + worst.n + '</b> بانخفاض ' + sg(mv(worst).d) + ' — يُنصح بمتابعته.', "bad"]);

    if (below) out.push(['<b>' + below + '</b> من الطلاب دون مستوى 86٪ — أولى الحالات بالمتابعة.', "bad"]);
    return out;
  }

  function studentInsights(c, s0) {

      out.push(['<b>' + l + '</b>: ' + r1(s0.a[i]) + ' من ' + s0.m[i] + ' (' + r0(p[i]) + '٪)' +

    var missing = s0.comp.filter(function (cp) { return cp[1] !== null && cp[1] < cp[2] - .01; });

      var tot = { up: 0, flat: 0, down: 0 };
      list.forEach(function (x) { var k = tally(x); tot.up += k.up; tot.flat += k.flat; tot.down += k.down; });
      body += masthead(lang, t.stageReport, lang === "en" ? "International Section" : "القسم العربي",
        t.students + ": " + all.length + " · " + t.term + ": " + D.term + " · " + D.year);
      body += hx(t.summary);
      body += bulletsHtml(lang === "en"
        ? [["<b>" + all.length + "</b> students across <b>" + list.length + "</b> class(es).", null],
           ["<b>" + tot.up + "</b> improved, <b>" + tot.flat + "</b> held level, <b>" + tot.down + "</b> declined.",
            tot.up >= tot.down ? "good" : "bad"]]
        : [["<b>" + all.length + "</b> طالبًا في <b>" + list.length + "</b> فصول.", null],
           ["<b>" + tot.up + "</b> تحسّن، <b>" + tot.flat + "</b> ثابت، <b>" + tot.down + "</b> تراجع.",
            tot.up >= tot.down ? "good" : "bad"]], lang);
      body += hx(t.classes);
      body += tableHtml([t.cls, t.students, t.total, t.pctv, t.improved, t.held, t.declined],
        list.map(function (x) {
          var k = tally(x);
          return [{ v: x.name }, x.students.length, r1(clsAvg(x)) + " / " + x.tmax, r0(clsAvgPct(x)) + "%",
            { v: k.up, colour: "#047857" }, k.flat, { v: k.down, colour: "#c0152f" }];
        }), "right");
      list.forEach(function (x) {
        body += hx(x.name);
        var cr2 = classRows(x, lang);
        body += tableHtml(cr2.headers, cr2.rows, "right");
      });
    }
    return '<html dir="' + t.dir + '"><head><meta charset="utf-8"><title>' + esc(scope.title) + '</title></head>' +
      '<body style="font-family:Segoe UI,Arial,sans-serif;color:#111827;margin:28px">' + body +
      '<p style="font-size:9pt;color:#78869b;margin-top:22px;border-top:1px solid #dde4ee;padding-top:8px">' +
      esc(t.school + " · " + t.record + " · " + stamp()) + '</p></body></html>';
  }

  function save(name, mime, text) {
    try {
      var blob = new Blob(["﻿" + text], { type: mime });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(function () { if (a.parentNode) a.parentNode.removeChild(a); URL.revokeObjectURL(url); }, 500);
    } catch (e) { notice(); }
  }
  function exportWord(scope) { save(safeName(scope.title) + ".doc", "application/msword", reportHtml(scope)); }
  function exportExcel(scope) { save(safeName(scope.title) + ".xls", "application/vnd.ms-excel", reportHtml(scope)); }
  function exportPdf(scope) {
    var w = window.open("", "_blank");
    if (!w) { notice(); return; }
    w.document.open(); w.document.write(reportHtml(scope)); w.document.close(); w.focus();
    setTimeout(function () { try { w.print(); } catch (e) {} }, 400);
  }
  function notice() {
    var n = h("div", "card pad mt");
    n.style.borderColor = "var(--mid)";
    n.style.color = "var(--mid)";
    n.textContent = "التحميل والطباعة معطّلان داخل صفحة Claude. افتح هذه الصفحة من موقع المدرسة ليعملا.";
    main.insertBefore(n, main.firstChild);
    window.scrollTo({ top: 0, behavior: "smooth" });
    setTimeout(function () { if (n.parentNode) n.parentNode.removeChild(n); }, 7000);
  }
  function exportBar(scope, label) {
    var lang = scope.lang;
    var bar = h("div", "expbar");
    bar.appendChild(h("span", "explabel", label));
    [[lang === "en" ? "Word" : "ملف Word", exportWord, "main"],
     [lang === "en" ? "Excel" : "ملف Excel", exportExcel, ""],
     [lang === "en" ? "PDF / Print" : "PDF / طباعة", exportPdf, ""]].forEach(function (b) {
      var btn = h("button", "btn " + b[2], b[0]);
      btn.type = "button";
      btn.addEventListener("click", function () { b[1](scope); });
      bar.appendChild(btn);
    });
    return bar;
  }

  function viewReport(c, skipHistory) {
    st = { cls: c, stu: null };
    var lang = langOf(c), t = T[lang];
    if (!skipHistory) pushView({ v: "report", c: c.id });
    crumbs([{ t: T.ar.allClasses, go: function () { viewAll(); } },
            { t: c.name, go: function () { viewClass(c); } }, { t: t.fullReport }], lang);
    var root = h("div");
    root.setAttribute("dir", t.dir);
    var k = tally(c), avg = attAvg(c);

    var hero = h("div", "hero");
    hero.appendChild(h("h1", null, t.classReport + " — " + c.name));
    hero.appendChild(h("p", null, t.reportHero
      .replace("{class}", c.name).replace("{sec}", c.sec)
      .replace("{term}", D.term).replace("{attempts}", c.labels.join(t.and))));
    var f = h("div", "facts");
    [c.students.length + " " + t.studentsWord, t.avgWord + " " + r1(clsAvg(c)) + " / " + c.tmax,
     t.improved + " " + k.up, t.declined + " " + k.down, D.year].forEach(function (x) { f.appendChild(h("span", null, x)); });
    hero.appendChild(f);
    root.appendChild(hero);

    var bb = h("div", "btnbar");
    var back = h("button", "btn", t.backToClass + " " + c.name); back.type = "button";
    back.addEventListener("click", function () { viewClass(c); });
    bb.appendChild(back);
    root.appendChild(bb);
    root.appendChild(exportBar({ kind: "class", cls: c, lang: lang,
      title: t.classReport + " - " + c.name + " - " + D.year }, t.downloadThis));

    root.appendChild(h("h2", "sh", t.classSummary));
    var sum = panel(null, null); sum.classList.add("pad");
    var ul = h("ul", "bullets");
    classInsights(c, lang).forEach(function (it) { var li = h("li", it[1] || null); li.innerHTML = it[0]; ul.appendChild(li); });
    sum.appendChild(ul);
    root.appendChild(sum);

    root.appendChild(h("h2", "sh", t.perStudent));
    root.appendChild(h("p", "sub", t.perStudentSub));
    c.students.slice().sort(function (a, b) { return (b.t || 0) - (a.t || 0); }).forEach(function (s0, i) {
      var m = mv(s0), tp = tpct(c, s0);
      var box2 = h("div", "rep");
      box2.setAttribute("dir", t.dir);
      var rh = h("div", "rh");
      rh.appendChild(h("span", "idx", String(i + 1)));
      rh.appendChild(h("span", "rn", s0.n));
      rh.appendChild(h("span", "lv " + s0.lv, lvName(s0.lv, lang)));
      rh.appendChild(h("span", "lv " + (m.dir === "up" ? "on_level" : m.dir === "down" ? "below" : "no_data"),
        m.d === null ? t.noDirection : (m.dir === "up" ? t.improved + " " : m.dir === "down" ? t.declined + " " : t.held + " ") + sg(m.d)));
      rh.appendChild(h("span", "lv no_data", r1(s0.t) + " " + t.outOf + " " + c.tmax + " · " + r0(tp) + "%"));
      box2.appendChild(rh);

      var rg = h("div", "rg");
      var left = h("div");
      var tbl = h("div", "mini");
      var tb2 = document.createElement("table");
      tb2.innerHTML = '<thead><tr><th>' + esc(t.test) + '</th><th>' + esc(t.mark) +
        '</th><th>' + esc(t.pctv) + '</th><th>' + esc(t.classAvg) + '</th></tr></thead>';
      var tb2b = document.createElement("tbody");
      c.labels.forEach(function (l, j) {
        var pv = pct(s0)[j], tr = document.createElement("tr");
        [l, s0.a[j] === null ? t.none : r1(s0.a[j]) + " / " + s0.m[j],
         pv === null ? t.none : r0(pv) + "%", avg[j] === null ? t.none : r0(avg[j]) + "%"]
          .forEach(function (v) { var td = document.createElement("td"); td.textContent = v; tr.appendChild(td); });
        tb2b.appendChild(tr);
      });
      tb2.appendChild(tb2b); tbl.appendChild(tb2); left.appendChild(tbl);
      left.appendChild(chartComponents(s0));
      rg.appendChild(left);

      var right = h("div");
      var ins = h("ul", "bullets");
      (lang === "en" ? enStudentInsights(c, s0) : studentInsights(c, s0)).forEach(function (it) {
        var li = h("li", it[1] || null); li.innerHTML = it[0]; ins.appendChild(li);
      });
      right.appendChild(ins);
      rg.appendChild(right);
      box2.appendChild(rg);
      root.appendChild(box2);
    });
    show(root);
  }

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (st.stu) viewClass(st.cls); else if (st.cls) viewAll();
  });
  viewAll();
})();
</script>
