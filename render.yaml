# Blueprint: creates static site + backend with SPA rewrite (/* -> /index.html).
#
# If you created the frontend as a manual "Static Site" instead, Render does NOT
# read this file for that service — add one rewrite in the dashboard:
#   Redirects/Rewrites → Source /*  Destination /index.html  Action Rewrite
# (Same behavior as vercel.json "rewrites" for React Router.)

services:
  - type: web
    name: al-anjal-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_BACKEND_URL
        # Example: https://al-anjal-follow-up-e-g.onrender.com
        sync: false

  - type: web
    name: al-anjal-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DB_NAME
        value: school_db
      - key: CORS_ORIGINS
        value: "*"

  # Optional: external keep-awake ping so backend stays warm even when no user has the app open.
  # Enable via Render Blueprint if desired.
  - type: cron
    name: al-anjal-backend-keepawake
    runtime: python
    rootDir: backend
    schedule: "*/10 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -c "import os, urllib.request; urllib.request.urlopen((os.environ.get('BACKEND_HEALTH_URL') or '').strip(), timeout=20).read()"
    envVars:
      - key: BACKEND_HEALTH_URL
        # Example: https://al-anjal-follow-up-e-g.onrender.com/health
        sync: false
