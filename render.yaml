# Blueprint: frontend as a Node web service (serve -s build) so React Router works
# without any Render dashboard "Redirects/Rewrites" (unlike runtime: static CDN).
#
# If you keep an old manual "Static Site", you must still add /* -> /index.html rewrite there,
# or delete it and deploy this Blueprint / recreate frontend as Node using the same commands below.

services:
  - type: web
    name: al-anjal-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run serve:prod
    envVars:
      - key: REACT_APP_BACKEND_URL
        # Example: https://al-anjal-follow-up-e-g.onrender.com
        sync: false

  - type: web
    name: al-anjal-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: MONGO_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DB_NAME
        value: school_db
      - key: CORS_ORIGINS
        value: "*"

  # Optional: external keep-awake ping so backend stays warm even when no user has the app open.
  # Enable via Render Blueprint if desired.
  - type: cron
    name: al-anjal-backend-keepawake
    runtime: python
    rootDir: backend
    schedule: "*/10 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -c "import os, urllib.request; urllib.request.urlopen((os.environ.get('BACKEND_HEALTH_URL') or '').strip(), timeout=20).read()"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: BACKEND_HEALTH_URL
        # Example: https://al-anjal-follow-up-e-g.onrender.com/health
        sync: false
